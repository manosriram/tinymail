name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundle_files: tinymail/target/release/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            bundle_files: |
              tinymail/target/release/bundle/deb/*.deb
              tinymail/target/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app (macOS)
        if: matrix.platform == 'macos-latest'
        run: cd tinymail && npx --prefix .. tauri build --bundles app

      - name: Re-sign and package dmg (macOS)
        # tauri-bundler's built-in dmg step re-touches the .app after it signs
        # it, which invalidates the ad-hoc signature's resource seal and makes
        # macOS report the app as "damaged" on launch. Building the .app only,
        # re-signing it last, then packaging the dmg ourselves keeps the
        # signature valid.
        if: matrix.platform == 'macos-latest'
        run: |
          APP=$(find tinymail/target/release/bundle/macos -name "*.app" -maxdepth 1)
          codesign --force --deep --sign - "$APP"
          mkdir -p dmg_root
          cp -R "$APP" dmg_root/
          ln -s /Applications dmg_root/Applications
          mkdir -p tinymail/target/release/bundle/dmg
          hdiutil create -volname "tinymail" -srcfolder dmg_root -ov -format UDZO \
            "tinymail/target/release/bundle/dmg/tinymail_aarch64.dmg"

      - name: Build app (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: cd tinymail && npx --prefix .. tauri build

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: tinymail ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: false
          files: ${{ matrix.bundle_files }}
